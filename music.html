<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin's Website - Music</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="projects.css">
    <link rel="stylesheet" href="music.css">
    <script src="utils.js"></script>
    <script src="nav.js"></script>
    <script src="music.js"></script>
    <script src="extras/torsaic/torsaic.js" defer></script>
</head>
<body>
    <div id="navbar"></div>

    <div class="container">
        <h1>What I've been listening to</h1>
        <em>Click a column to sort, click a row to expand.</em>

        <div class="filter-panel">
            <div class="filter-header">
                <span>FILTERS</span>
                <span class="filter-toggle">+</span>
            </div>
            <div class="filter-content" id="filter-content">
                <div class="filter-groups" id="filter-groups"></div>
            </div>
        </div>

        <div class="music-table-wrap">
            <table id="music-table" class="music-table"></table>
        </div>
    </div>

    <script>
        document.getElementById('navbar').innerHTML = createNavbar('Home');
        document.querySelector('.filter-header').addEventListener('click', function () {
            const content = document.getElementById('filter-content');
            content.classList.toggle('expanded');
            this.querySelector('.filter-toggle').textContent = content.classList.contains('expanded') ? '−' : '+';
        });
        loadMusicTable('music-table', 'filter-groups');
    </script>
</body>
</html>
